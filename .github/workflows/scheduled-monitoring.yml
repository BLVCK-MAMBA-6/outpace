name: Outpace Scheduled Monitoring

on:
  schedule:
    - cron: "15 6,18 * * *"
    - cron: "45 */2 * * *"

  workflow_dispatch:
    inputs:
      scope:
        description: Monitoring scope to run
        required: true
        default: pending
        type: choice
        options:
          - pending
          - scheduled
          - all
          - general
          - pricing
          - reviews
          - jobs
          - news
          - digest

permissions:
  contents: read

concurrency:
  group: outpace-scheduled-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: Run monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ENVIRONMENT: production

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3-flash
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash

      G2_API_TOKEN: ${{ secrets.G2_API_TOKEN }}
      G2_API_BASE_URL: https://data.g2.com

      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
      DIGEST_USER_ID: ${{ secrets.DIGEST_USER_ID }}

      MONITORING_EXCLUDED_COMPETITOR_IDS: ${{ secrets.MONITORING_EXCLUDED_COMPETITOR_IDS }}

    steps:
      - name: Select monitoring scope
        id: plan
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            scope="${{ inputs.scope }}"
          elif [[ "${{ github.event.schedule }}" == "45 */2 * * *" ]]; then
            scope="pending"
          else
            scope="scheduled"
          fi

          should_run="true"

          if [[ "$scope" == "pending" ]]; then
            response="$(
              curl --fail --silent --show-error \
                "${SUPABASE_URL}/rest/v1/monitoring_tasks?execution_backend=eq.database&state=eq.PENDING&select=task_id&limit=1" \
                -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
            )"

            if [[ "$response" == "[]" ]]; then
              should_run="false"
            fi
          fi

          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.plan.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.plan.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        if: steps.plan.outputs.should_run == 'true'
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        if: steps.plan.outputs.should_run == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Run scheduled monitoring
        if: steps.plan.outputs.should_run == 'true'
        run: >-
          python scripts/run_scheduled_monitoring.py
          --scope "${{ steps.plan.outputs.scope }}"

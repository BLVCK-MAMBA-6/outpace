name: Outpace Scheduled Monitoring

on:
  schedule:
    - cron: "15 6,18 * * *"

  workflow_dispatch:
    inputs:
      scope:
        description: Monitoring scope to run
        required: true
        default: scheduled
        type: choice
        options:
          - scheduled
          - all
          - general
          - pricing
          - reviews
          - jobs
          - news
          - digest

permissions:
  contents: read

concurrency:
  group: outpace-scheduled-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    name: Run monitoring
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      ENVIRONMENT: production

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3-flash
      GEMINI_FALLBACK_MODEL: gemini-2.5-flash

      G2_API_TOKEN: ${{ secrets.G2_API_TOKEN }}
      G2_API_BASE_URL: https://data.g2.com

      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      DIGEST_TO_EMAIL: ${{ secrets.DIGEST_TO_EMAIL }}
      DIGEST_USER_ID: ${{ secrets.DIGEST_USER_ID }}

      MONITORING_EXCLUDED_COMPETITOR_IDS: ${{ secrets.MONITORING_EXCLUDED_COMPETITOR_IDS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run scheduled monitoring
        run: >-
          python scripts/run_scheduled_monitoring.py
          --scope "${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'scheduled' }}"
